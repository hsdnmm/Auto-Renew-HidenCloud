name: 【自定义】每周二23:30续期
on:
  schedule:
    - cron: '30 23 * * 2'
      timezone: Asia/Shanghai
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run renew script
        env:
          HIDEN_EMAIL: ${{ secrets.HIDEN_EMAIL }}
          HIDEN_PASSWORD: ${{ secrets.HIDEN_PASSWORD }}
        run: python3 renew.py
