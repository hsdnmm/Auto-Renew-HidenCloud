# cron.yml
name: 定时调度续期
on:
  schedule:
    - cron: '0 0 * * 2'
      timezone: Asia/Shanghai # 北京时间 每周一 00:00
  workflow_dispatch: # 手动点测试

jobs:
  run_renew:
    # 调用同仓库 renew.yml
    uses: hsdnmm/Auto-Renew-HidenCloud/.github/workflows/renew.yml@main
    # 把仓库secrets全部传递给renew.yml（必须加，否则账号密码读不到）
    secrets: inherit

