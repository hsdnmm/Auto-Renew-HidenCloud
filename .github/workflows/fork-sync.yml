name: 自动同步上游 + TG告警

on:
  schedule:
    - cron: '0 15 * * 2'
  workflow_dispatch:

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 同步上游代码
        uses: dabreadman/sync-repo-git@v1
        with:
          source_url: "https://github.com/eooce/Auto-Renew-HidenCloud.git"
          source_branch: "main"
          target_branch: "main"
          # 💡 核心保护：在这里排除 renew.yml，不让上游或同步动作覆盖您自己改好的时间文件！
          exclude: |
            .github/workflows/renew.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ 成功通知
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
          -d "text=✅ Auto-Renew-HidenCloud 上游同步成功！"

      - name: ❌ 失败告警
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
          -d "text=⚠️ 同步失败，请检查日志。"
