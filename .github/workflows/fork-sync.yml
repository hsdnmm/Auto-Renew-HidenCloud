name: 自动同步上游 + TG告警

on:
  schedule:
    - cron: '0 15 * * 2' # 每天定时运行一次
  workflow_dispatch: # 支持手动触发

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git 并拉取上游
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 添加上游仓库地址（请将下方的 URL 替换为您实际的上游原作者仓库地址）
          git remote add upstream https://github.com/eooce/Auto-Renew-HidenCloud.git
          git fetch upstream

          # 2. 核心：合并上游代码，但强制在本地保留您自己修改好的 renew.yml 不被覆盖
          git checkout main
          git merge upstream/main --allow-unrelated-histories -m "🤖自动同步上游代码" || true
          
          # 3. 保护动作：确保 .github/workflows/renew.yml 恢复为您本地自定义的版本（不使用上游的）
          git checkout HEAD -- .github/workflows/renew.yml || true

      - name: 提交并推送
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "🤖自动同步上游代码（已保护本地 renew.yml）"
            git push origin main
          fi

      - name: ✅ 成功通知
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
          -d "text=✅ Auto-Renew-HidenCloud 上游同步成功！"

      - name: ❌ 失败告警
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
          -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
          -d "text=⚠️ 同步失败，请检查 Actions 运行日志。"
